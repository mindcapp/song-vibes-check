name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o song-similarity ./cmd/server

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_KEY }}

      - name: Trust VPS host key
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy binary to VPS
        run: scp song-similarity "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/song-similarity/app"

      - name: Restart service and verify health
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            sudo systemctl stop song-similarity || true
            sudo chmod +x /opt/song-similarity/app
            sudo systemctl start song-similarity
            sleep 2
            curl -sf http://127.0.0.1:8080/health || (sudo systemctl stop song-similarity && exit 1)
          '
