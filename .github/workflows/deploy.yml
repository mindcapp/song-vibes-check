name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o song-similarity ./cmd/server

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy binary to VPS
        run: scp -o ConnectTimeout=10 song-similarity ${{ secrets.VPS_USER }}@${{ secrets.SSH_HOST }}:/opt/song-similarity/app

      - name: Restart service and verify health
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.SSH_HOST }} << 'SCRIPT'
          set -e
          sudo systemctl stop song-similarity || true
          sudo chmod +x /opt/song-similarity/app
          sudo systemctl start song-similarity
          sleep 2
          curl -sf http://127.0.0.1:8080/health || (sudo systemctl stop song-similarity && exit 1)
          echo "✓ Deploy successful"
          SCRIPT