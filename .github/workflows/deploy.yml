name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      
      - name: Build
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o song-similarity ./cmd/server
      
      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.VPS_KEY }}
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null
          scp -o ConnectTimeout=10 -o StrictHostKeyChecking=no song-similarity $DEPLOY_USER@$DEPLOY_HOST:/opt/song-similarity/app
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'DEPLOY'
          sudo systemctl stop song-similarity || true
          sudo chmod +x /opt/song-similarity/app
          sudo systemctl start song-similarity
          sleep 2
          curl -sf http://127.0.0.1:8080/health || (sudo systemctl stop song-similarity && exit 1)
          echo "✓ Deploy successful"
          DEPLOY
