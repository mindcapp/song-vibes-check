version: '3.8'

services:
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - MB_USER_AGENT=${MB_USER_AGENT:-}
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL=${CACHE_TTL:-24h}
      - CACHE_NEGATIVE_TTL=${CACHE_NEGATIVE_TTL:-10m}
    depends_on:
      - redis
    networks:
      - default
      - monitoring

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  user-service-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=user_service
      - POSTGRES_PASSWORD=user_service
      - POSTGRES_DB=user_service
    volumes:
      - user_service_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  user-service:
    build:
      context: ./user-service
    ports:
      - "8002:8002"
    environment:
      - SECRET_KEY=${USER_SERVICE_SECRET_KEY:-change-me-to-a-long-random-string}
      - DATABASE_URL=postgres://user_service:user_service@user-service-db:5432/user_service?sslmode=disable
    depends_on:
      user-service-db:
        condition: service_healthy
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  user_service_db_data:

networks:
  monitoring:
    driver: bridge
