services:
  api:
    build:
      context: .
    ports:
      # Bound to loopback, like every published port in this file. To serve
      # other machines, put a reverse proxy in front (see deploy/nginx.conf).
      - "127.0.0.1:8080:8080"
    environment:
      - MB_USER_AGENT=${MB_USER_AGENT:-song-vibes-check/0.2.0 ( https://github.com/mindcapp/song-vibes-check )}
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL=${CACHE_TTL:-24h}
      - CACHE_LOW_DATA_TTL=${CACHE_LOW_DATA_TTL:-1h}
      - CACHE_NEGATIVE_TTL=${CACHE_NEGATIVE_TTL:-10m}
      - CACHE_ARTIST_TTL=${CACHE_ARTIST_TTL:-72h}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-20s}
    depends_on:
      - redis
    networks:
      - default
      - monitoring

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  # Heavy (PyTorch) and needs a Genius API key, so it only starts on request:
  #   GENIUS_API_KEY=... docker compose --profile mood up --build
  mood-service:
    profiles: ["mood"]
    build:
      context: ./mood-service
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - GENIUS_API_KEY=${GENIUS_API_KEY:-}
    networks:
      - default

  user-service-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=user_service
      # The default password is for local development only. Set
      # POSTGRES_PASSWORD for anything reachable by others. The database port
      # is not published: only containers on this network can connect.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-user_service}
      - POSTGRES_DB=user_service
    volumes:
      - user_service_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  user-service:
    build:
      context: ./user-service
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      # No default on purpose: user-service refuses to start without a key of
      # at least 32 characters. Generate one with:
      #   export USER_SERVICE_SECRET_KEY=$(openssl rand -hex 32)
      - SECRET_KEY=${USER_SERVICE_SECRET_KEY:-}
      # Connection parameters are passed separately rather than as a URL so
      # that a password with special characters needs no escaping.
      - DB_HOST=user-service-db
      - DB_PORT=5432
      - DB_USER=user_service
      - DB_PASSWORD=${POSTGRES_PASSWORD:-user_service}
      - DB_NAME=user_service
      - DB_SSLMODE=disable
    depends_on:
      user-service-db:
        condition: service_healthy
    networks:
      - default

  prometheus:
    image: prom/prometheus:v3.13.2
    ports:
      # Bound to loopback: Prometheus has no authentication.
      - "127.0.0.1:9090:9090"
    volumes:
      - ${PROMETHEUS_CONFIG:-./prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.1.3
    ports:
      # Bound to loopback; put a reverse proxy in front to expose it.
      - "127.0.0.1:3000:3000"
    environment:
      # The default password is for local development only. Set
      # GF_ADMIN_PASSWORD for anything reachable by others. It is applied when
      # the grafana_data volume is first created; later changes need
      # `grafana cli admin reset-admin-password` or a fresh volume.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  user_service_db_data:

networks:
  monitoring:
    driver: bridge
