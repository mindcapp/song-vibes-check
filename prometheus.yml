# Scrape config for the local docker-compose stack.
# For a deployment on a VPS copy prometheus.vps.yml.example to
# prometheus.vps.yml (git-ignored), put the server address there and start
# compose with PROMETHEUS_CONFIG=./prometheus.vps.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'song-vibes-check'
    static_configs:
      - targets: ['api:8080']
